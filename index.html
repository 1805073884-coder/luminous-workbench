<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Luminous">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f8e8ee">
<title>Luminous Workbench</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect rx='20' width='100' height='100' fill='%23f8c8d8'/><text x='50' y='65' text-anchor='middle' font-size='45' fill='%23fff'>✨</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect rx='20' width='100' height='100' fill='%23f8c8d8'/><text x='50' y='65' text-anchor='middle' font-size='45' fill='%23fff'>✨</text></svg>">
<style>
:root {
  --pink-50:#fce4ec; --pink-100:#f8bbd0; --pink-200:#f48fb1; --pink-300:#f06292;
  --blue-50:#e3f2fd; --blue-100:#bbdefb; --blue-200:#90caf9; --blue-300:#64b5f6;
  --bg:#faf8f9; --card-bg:#fff; --text:#4a4458; --text-light:#8a8294;
  --shadow:0 2px 12px rgba(0,0,0,0.06); --radius:14px;
  --nav-w:220px; --header-h:56px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;overflow:hidden;height:100vh;display:flex;}
/* Nav */
#nav{width:var(--nav-w);min-width:var(--nav-w);background:linear-gradient(180deg,#fce4ec 0%,#f8e0e8 30%,#e8e0f0 70%,#e3f2fd 100%);display:flex;flex-direction:column;border-right:1px solid rgba(0,0,0,0.05);z-index:100;transition:transform .3s;}
#nav-header{padding:20px 16px 14px;text-align:center;border-bottom:1px solid rgba(0,0,0,0.05);}
#nav-header .avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--pink-200),var(--blue-200));display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:22px;color:#fff;font-weight:700;}
#nav-header .name{font-size:15px;font-weight:600;color:var(--text);}
#nav-header .tag{font-size:11px;color:var(--text-light);margin-top:2px;}
#nav-list{flex:1;overflow-y:auto;padding:8px 0;-webkit-overflow-scrolling:touch;}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;font-size:13.5px;color:var(--text);transition:all .2s;border-left:3px solid transparent;margin:1px 0;}
.nav-item:hover{background:rgba(255,255,255,0.5);}
.nav-item.active{background:rgba(255,255,255,0.7);border-left-color:var(--pink-200);font-weight:600;color:var(--pink-300);}
.nav-item .icon{font-size:16px;width:22px;text-align:center;flex-shrink:0;}
/* Main */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#main-header{height:var(--header-h);min-height:var(--header-h);background:var(--card-bg);border-bottom:1px solid rgba(0,0,0,0.05);display:flex;align-items:center;padding:0 18px;gap:10px;}
#menu-btn{display:none;font-size:22px;cursor:pointer;background:none;border:none;color:var(--text);padding:4px;line-height:1;}
#main-header .title{font-size:16px;font-weight:600;flex:1;}
#main-header .date{font-size:12px;color:var(--text-light);}
#content{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch;}
/* Overlay */
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:99;}
/* Cards */
.card{background:var(--card-bg);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.card-title{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.card-title .icon{font-size:16px;}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .2s;}
.btn-pink{background:var(--pink-50);color:var(--pink-300);}
.btn-pink:hover{background:var(--pink-100);}
.btn-blue{background:var(--blue-50);color:#5c8dc9;}
.btn-blue:hover{background:var(--blue-100);}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:14px;}
.btn-outline{background:transparent;border:1.5px solid var(--pink-100);color:var(--pink-300);}
.btn-danger{background:#fce4ec;color:#e57373;}
/* Inputs */
input,textarea,select{width:100%;padding:10px 12px;border:1.5px solid #e8e0e8;border-radius:10px;font-size:13px;font-family:inherit;background:#faf8f9;color:var(--text);outline:none;transition:border .2s;}
input:focus,textarea:focus,select:focus{border-color:var(--pink-200);}
input[type="number"]{-moz-appearance:textfield;}
input[type="number"]::-webkit-inner-spin-button{display:none;}
textarea{resize:vertical;min-height:70px;}
/* Checkbox */
.todo-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f5f0f5;cursor:pointer;}
.todo-item:last-child{border-bottom:none;}
.todo-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--pink-100);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;transition:all .2s;}
.todo-item.done .todo-check{background:var(--pink-200);border-color:var(--pink-200);color:#fff;}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--text-light);}
.todo-text{flex:1;font-size:13px;}
.todo-del{color:#ccc;cursor:pointer;font-size:14px;padding:2px 6px;}
.todo-del:hover{color:#e57373;}
/* Progress */
.progress-bar{height:8px;border-radius:4px;background:#f0e8f0;margin:10px 0;overflow:hidden;}
.progress-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--pink-200),var(--blue-200));transition:width .4s;}
/* Tags */
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:500;}
.tag-pink{background:var(--pink-50);color:var(--pink-300);}
.tag-blue{background:var(--blue-50);color:#5c8dc9;}
.tag-green{background:#e8f5e9;color:#66bb6a;}
.tag-orange{background:#fff3e0;color:#ff9800;}
/* Sheet */
.sheet{background:var(--card-bg);border-radius:var(--radius) var(--radius) 0 0;padding:20px;position:fixed;bottom:0;left:0;right:0;z-index:200;max-height:70vh;overflow-y:auto;box-shadow:0 -4px 20px rgba(0,0,0,0.1);transform:translateY(100%);transition:transform .3s;}
.sheet.open{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:#ddd;margin:0 auto 14px;}
.sheet-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:199;}
.sheet-bg.open{display:block;}
/* Inspiration card */
.inspo-card{background:linear-gradient(135deg,#fff 0%,var(--pink-50) 100%);border-radius:var(--radius);padding:14px;margin-bottom:10px;border:1px solid var(--pink-50);}
.inspo-card .hot-badge{background:#ff5252;color:#fff;font-size:10px;padding:2px 8px;border-radius:10px;display:inline-block;margin-bottom:6px;}
.inspo-card h4{font-size:13px;margin-bottom:4px;line-height:1.5;}
.inspo-card .reason{font-size:11px;color:var(--text-light);margin:6px 0;}
.inspo-card .adapt{font-size:11px;color:var(--pink-300);background:rgba(255,255,255,0.7);padding:8px 10px;border-radius:8px;margin-top:8px;line-height:1.5;}
/* Summary row */
.stat-row{display:flex;gap:8px;margin:10px 0;}
.stat-box{flex:1;background:linear-gradient(135deg,var(--pink-50),var(--blue-50));border-radius:10px;padding:10px;text-align:center;}
.stat-box .num{font-size:20px;font-weight:700;color:var(--pink-300);}
.stat-box .label{font-size:10px;color:var(--text-light);margin-top:2px;}
/* Empty state */
.empty-state{text-align:center;padding:30px 20px;color:var(--text-light);}
.empty-state .icon{font-size:36px;margin-bottom:8px;}
/* Date picker */
.date-nav{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.date-nav .date-display{flex:1;text-align:center;font-size:14px;font-weight:600;}
.date-nav button{background:none;border:none;font-size:18px;cursor:pointer;color:var(--pink-300);padding:4px 8px;}
/* Table */
.simple-table{width:100%;border-collapse:collapse;font-size:12px;}
.simple-table th,.simple-table td{padding:8px 6px;text-align:left;border-bottom:1px solid #f5f0f5;}
.simple-table th{color:var(--text-light);font-weight:500;font-size:11px;}
/* Audio player */
.audio-bar{display:flex;align-items:center;gap:8px;padding:8px;background:#faf8f9;border-radius:10px;margin:8px 0;}
.audio-btn{width:34px;height:34px;border-radius:50%;border:none;background:var(--pink-200);color:#fff;font-size:16px;cursor:pointer;flex-shrink:0;}
.audio-btn:hover{background:var(--pink-300);}
.audio-speed{font-size:11px;cursor:pointer;padding:3px 8px;border-radius:10px;background:var(--blue-50);color:#5c8dc9;}
/* Link button */
.link-btn{font-size:11px;color:var(--pink-300);text-decoration:none;display:inline-flex;align-items:center;gap:3px;cursor:pointer;}
.link-btn:hover{text-decoration:underline;}
/* Tip */
.tip{font-size:11px;color:var(--text-light);text-align:center;padding:10px;font-style:italic;}
/* Responsive */
@media(max-width:768px){
  #nav{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);}
  #nav.open{transform:translateX(0);}
  #overlay.open{display:block;}
  #menu-btn{display:block;}
  #content{padding:12px;}
  .card{padding:14px;margin-bottom:10px;}
  .stat-row{gap:6px;}
  .stat-box{padding:8px;}
  .stat-box .num{font-size:16px;}
}
/* Print hidden */
.hidden{display:none!important;}
.fade-in{animation:fadeIn .3s;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
/* Chart */
.chart-bar{display:flex;align-items:end;gap:4px;height:100px;padding:0 4px;}
.chart-bar .bar{flex:1;border-radius:4px 4px 0 0;transition:height .4s;min-width:8px;}
/* Measure table */
.measure-table{width:100%;font-size:12px;}
.measure-table td{padding:6px 4px;border-bottom:1px solid #f5f0f5;}
.measure-table td:last-child{text-align:right;font-weight:600;}
.measure-table .change-up{color:#e57373;}
.measure-table .change-down{color:#66bb6a;}
.measure-table .change-same{color:var(--text-light);}
/* Script card */
.script-card{background:linear-gradient(135deg,#fff 0%,var(--blue-50) 100%);border-radius:var(--radius);padding:14px;margin-bottom:10px;border:1px solid var(--blue-50);}
.script-card h4{font-size:13px;margin-bottom:6px;}
.script-card .script-content{font-size:12px;line-height:1.6;color:var(--text);background:rgba(255,255,255,0.6);padding:10px;border-radius:8px;margin:8px 0;}
.status-tags{display:flex;gap:6px;margin-top:8px;}
.status-tag{cursor:pointer;font-size:11px;padding:3px 10px;border-radius:10px;border:1.5px solid #e0e0e0;background:#fff;color:var(--text-light);transition:all .2s;}
.status-tag.active-status{background:var(--pink-50);border-color:var(--pink-200);color:var(--pink-300);font-weight:600;}
/* IELTS */
.ielts-card{background:linear-gradient(135deg,#fff 0%,#f3e5f5 100%);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
.speaking-question{font-size:13px;font-weight:600;margin-bottom:8px;}
.model-answer{font-size:12px;line-height:1.7;color:var(--text);background:rgba(255,255,255,0.7);padding:10px;border-radius:8px;}
/* Outfit */
.outfit-card{display:flex;gap:10px;align-items:center;padding:10px;background:linear-gradient(135deg,var(--pink-50),var(--blue-50));border-radius:12px;margin-bottom:8px;}
.outfit-card .outfit-icon{font-size:28px;}
.outfit-card .outfit-text{font-size:12px;line-height:1.5;}
</style>
</head>
<body>

<!-- Overlay -->
<div id="overlay" onclick="toggleNav()"></div>

<!-- Navigation -->
<nav id="nav">
  <div id="nav-header">
    <div class="avatar">✨</div>
    <div class="name">Luminous</div>
    <div class="tag">创作者工作台</div>
  </div>
  <div id="nav-list"></div>
</nav>

<!-- Main -->
<div id="main">
  <div id="main-header">
    <button id="menu-btn" onclick="toggleNav()">☰</button>
    <div class="title" id="main-title">每日计划</div>
    <div class="date" id="current-date"></div>
  </div>
  <div id="content"></div>
</div>

<!-- Bottom Sheet -->
<div class="sheet-bg" id="sheetBg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>

<script>
// ==================== DATA ENGINE ====================
const DB = {
  _prefix:'lw_',
  get(k){ try{const v=localStorage.getItem(this._prefix+k);return v?JSON.parse(v):null;}catch(e){return null;} },
  set(k,v){ try{localStorage.setItem(this._prefix+k,JSON.stringify(v));}catch(e){} },
  getDefault(k,d){ const v=this.get(k);return v!==null?v:d; }
};

// Initialize defaults
function initDB(){
  if(!DB.get('init')){
    DB.set('todos',{
      '2026-07-28':[
        {id:1,text:'行业新闻 10min',done:false},
        {id:2,text:'英语听力 60min',done:false},
        {id:3,text:'英语口语 30min',done:false},
        {id:4,text:'英语阅读 60min',done:false},
        {id:5,text:'多邻国 30min',done:false},
        {id:6,text:'MPA学习 30min',done:false},
      ]
    });
    DB.set('expenses',{});
    DB.set('reviews',[]);
    DB.set('inspirations',{});
    DB.set('remixes_all',{});
    DB.set('remixes',[]);
    DB.set('worklogs',[]);
    DB.set('body_measures',{height:165,waist:68,hip:92,thigh:52,calf:34,arm:26,shoulder:38,leg_length:98});
    DB.set('body_measure_history',[]);
    DB.set('body_exercises',{});
    DB.set('init',true);
  }
  // Ensure today's todos exist
  const today = getToday();
  const todos = DB.get('todos')||{};
  if(!todos[today]){
    todos[today]=[
      {id:1,text:'行业新闻 10min',done:false},
      {id:2,text:'英语听力 60min',done:false},
      {id:3,text:'英语口语 30min',done:false},
      {id:4,text:'英语阅读 60min',done:false},
      {id:5,text:'多邻国 30min',done:false},
      {id:6,text:'MPA学习 30min',done:false},
    ];
    DB.set('todos',todos);
  }
  // Ensure today's expenses
  const expenses = DB.get('expenses')||{};
  if(!expenses[today]){expenses[today]=[];DB.set('expenses',expenses);}
  // Ensure today's exercises
  const exercises = DB.get('body_exercises')||{};
  if(!exercises[today]){exercises[today]=[];DB.set('body_exercises',exercises);}
  // Ensure today's worklog
  const worklogs = DB.get('worklogs')||[];
  const todayLog = worklogs.find(w=>w.date===today);
  if(!todayLog){worklogs.push({date:today,completed:'',harvest:'',plan:''});DB.set('worklogs',worklogs);}
  // Migrate old array-format data to date-grouped format
  migrateOldData();
}

function migrateOldData(){
  // Migrate inspirations: old array format → date-grouped object
  const oldInsp = DB.get('inspirations');
  if(Array.isArray(oldInsp) && oldInsp.length>0){
    const today = getToday();
    const newInsp = {};
    newInsp[today] = oldInsp;
    DB.set('inspirations',newInsp);
  }
  // Migrate remixes: old array format → date-grouped object  
  const oldRem = DB.get('remixes');
  if(Array.isArray(oldRem) && oldRem.length>0){
    const today = getToday();
    const newRem = {};
    newRem[today] = oldRem;
    DB.set('remixes_all',newRem);
    DB.set('remixes',[]);
  }
}

function getToday(){return new Date().toISOString().split('T')[0];}
function getNow(){const d=new Date();return d.toISOString().split('T')[0]+' '+d.toTimeString().split(' ')[0].slice(0,5);}

// ==================== NAVIGATION ====================
const MODULES = [
  {id:'daily',name:'每日计划',icon:'📋'},
  {id:'inspiration',name:'选题灵感',icon:'💡'},
  {id:'remix',name:'爆款二创',icon:'🔥'},
  {id:'review',name:'内容复盘',icon:'📊'},
  {id:'english',name:'英语学习',icon:'🇬🇧'},
  {id:'mpa',name:'MPA学习',icon:'📚'},
  {id:'expense',name:'消费记账',icon:'💰'},
  {id:'news',name:'行业新闻',icon:'📰'},
  {id:'worklog',name:'工作总结',icon:'📝'},
  {id:'body',name:'身材管理',icon:'💪'},
];

let currentModule = 'daily';
let sheetCallback = null;

function buildNav(){
  const list = document.getElementById('nav-list');
  list.innerHTML = MODULES.map((m,i)=>`<div class="nav-item" data-mod="${m.id}" onclick="switchModule('${m.id}')"><span class="icon">${m.icon}</span>${m.name}</div>`).join('');
}

function switchModule(id){
  currentModule = id;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.mod===id));
  const mod = MODULES.find(m=>m.id===id);
  document.getElementById('main-title').textContent = mod?mod.name:'';
  document.getElementById('content').innerHTML = '';
  renderModule(id);
  if(window.innerWidth<=768) toggleNav(false);
}

function toggleNav(force){
  const nav = document.getElementById('nav');
  const overlay = document.getElementById('overlay');
  if(typeof force==='boolean'){
    nav.classList.toggle('open',force);
    overlay.classList.toggle('open',force);
  }else{
    nav.classList.toggle('open');
    overlay.classList.toggle('open');
  }
}

function updateDate(){
  const d=new Date();
  const week=['日','一','二','三','四','五','六'];
  document.getElementById('current-date').textContent=
    `${d.getFullYear()}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')} 星期${week[d.getDay()]}`;
}

// ==================== SHEET ====================
function openSheet(html,cb){
  document.getElementById('sheet').innerHTML = `<div class="sheet-handle"></div>${html}`;
  document.getElementById('sheet').classList.add('open');
  document.getElementById('sheetBg').classList.add('open');
  sheetCallback = cb;
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('sheetBg').classList.remove('open');
  if(sheetCallback){sheetCallback();sheetCallback=null;}
}

// ==================== MODULE RENDERERS ====================

// 1. 每日计划
function renderDaily(dateOverride){
  const today = dateOverride || getToday();
  const todosAll = DB.get('todos')||{};
  const todos = todosAll[today]||[];
  const doneCount = todos.filter(t=>t.done).length;
  const total = todos.length;
  const pct = total>0?Math.round(doneCount/total*100):0;

  let html = `<div class="date-nav">
    <button onclick="renderDaily(navDate('${today}',-1))">◀</button>
    <div class="date-display">${today}${today===getToday()?' (今天)':''}</div>
    <button onclick="renderDaily(navDate('${today}',1))">▶</button>
    <button onclick="renderDaily()" style="font-size:12px;">今天</button>
  </div>`;

  // Stats
  html += `<div class="stat-row">
    <div class="stat-box"><div class="num">${total}</div><div class="label">总任务</div></div>
    <div class="stat-box"><div class="num">${doneCount}</div><div class="label">已完成</div></div>
    <div class="stat-box"><div class="num">${total-doneCount}</div><div class="label">待完成</div></div>
    <div class="stat-box"><div class="num">${pct}%</div><div class="label">完成率</div></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;

  // Todo list
  html += `<div class="card"><div class="card-title"><span class="icon">✅</span>待办清单</div>`;
  todos.forEach(t=>{
    html += `<div class="todo-item${t.done?' done':''}" onclick="toggleTodo('${today}',${t.id})">
      <div class="todo-check">✓</div>
      <div class="todo-text">${escHtml(t.text)}</div>
      <div class="todo-del" onclick="event.stopPropagation();deleteTodo('${today}',${t.id})">×</div>
    </div>`;
  });
  html += `</div>`;

  // Add new todo
  html += `<div class="card">
    <div style="display:flex;gap:8px;">
      <input type="text" id="newTodoInput" placeholder="新增任务..." style="flex:1;">
      <button class="btn btn-pink btn-sm" onclick="addTodo('${today}')">+ 添加</button>
    </div>
  </div>`;

  // History dates
  const dates = Object.keys(todosAll).sort().reverse().slice(0,14);
  html += `<div class="card"><div class="card-title">📅 历史计划</div><div style="display:flex;flex-wrap:wrap;gap:6px;">`;
  dates.forEach(d=>{
    const tds = todosAll[d]||[];
    const done = tds.filter(t=>t.done).length;
    html += `<span class="tag tag-pink" style="cursor:pointer;" onclick="renderDaily('${d}')">${d.slice(5)} (${done}/${tds.length})</span>`;
  });
  html += `</div></div>`;

  document.getElementById('content').innerHTML = html;
}

function navDate(date,offset){
  const d = new Date(date);
  d.setDate(d.getDate()+offset);
  return d.toISOString().split('T')[0];
}

function toggleTodo(date,id){
  const todos = DB.get('todos')||{};
  if(!todos[date]) return;
  const t = todos[date].find(t=>t.id===id);
  if(t){t.done=!t.done;}
  DB.set('todos',todos);
  renderDaily(date);
}

function deleteTodo(date,id){
  const todos = DB.get('todos')||{};
  if(!todos[date]) return;
  todos[date] = todos[date].filter(t=>t.id!==id);
  DB.set('todos',todos);
  renderDaily(date);
}

function addTodo(date){
  const input = document.getElementById('newTodoInput');
  const text = input.value.trim();
  if(!text) return;
  const todos = DB.get('todos')||{};
  if(!todos[date]) todos[date]=[];
  const maxId = todos[date].reduce((m,t)=>Math.max(m,t.id),0);
  todos[date].push({id:maxId+1,text,done:false});
  DB.set('todos',todos);
  input.value='';
  renderDaily(date);
}

function generateAnalysis(r){
  let tips = [];
  if((r.completion||0)<30) tips.push('完播率偏低 → 优化视频前3秒前置钩子，用"悬念+数字"开头（如"28岁研发人的一天，第3件事让我崩溃"）');
  if((r.completion||0)>=30&&(r.completion||0)<50) tips.push('完播率中等 → 检查视频中段是否有内容断层，建议加入节奏变化或画面切换');
  if((r.comments||0)<10) tips.push('评论偏少 → 视频结尾设置互动提问（如"你也在职备考吗？评论区聊聊"）引导留言');
  if((r.likes||0)<(r.views||1)*0.03) tips.push('点赞率偏低 → 强化内容共鸣点，在视频中增加"你是不是也…"类共情表达');
  if((r.shares||0)<5) tips.push('转发量低 → 内容缺乏"利他性"，尝试加入可复用的方法/清单/模板类干货');
  if(r.source==='搜索'&&(r.views||0)>500) tips.push('搜索流量占比高 → 标题和标签SEO效果好，继续保持关键词优化');
  if(r.source==='推荐'&&(r.views||0)<300) tips.push('推荐流量偏低 → 检查封面图吸引力，尝试"大字标题+表情+对比色"封面公式');
  if(tips.length===0) tips.push('数据表现良好，继续保持内容质量和更新频率！');
  return tips.join('<br>');
}

// Sentence speaking
let speechRate = 1;
let currentSentenceIdx = -1;

function cycleSpeed(el){
  speechRate = speechRate===1?1.5:speechRate===1.5?0.75:1;
  el.textContent = speechRate+'x';
}

function speakSentence(idx){
  const today = getToday();
  const ed = (DB.get('english_data')||{})[today];
  if(!ed) return;
  const s = ed.article.sentences[idx];
  if(s && 'speechSynthesis' in window){
    window.speechSynthesis.cancel();
    currentSentenceIdx = idx;
    const u = new SpeechSynthesisUtterance(s.en);
    u.rate = speechRate; u.lang='en-US';
    u.onend = ()=>{ currentSentenceIdx = -1; };
    window.speechSynthesis.speak(u);
  }
}

function speakAllSentences(){
  const today = getToday();
  const ed = (DB.get('english_data')||{})[today];
  if(!ed) return;
  const text = ed.article.sentences.map(s=>s.en).join(' ');
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = speechRate; u.lang='en-US';
    window.speechSynthesis.speak(u);
  }
}

function speakAnswer(){
  const today = getToday();
  const ed = (DB.get('english_data')||{})[today];
  if(ed && 'speechSynthesis' in window){
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(ed.speaking.answer);
    u.rate = 0.85; u.lang='en-US';
    window.speechSynthesis.speak(u);
  }
}

// Dictation
function renderDictation(sentences){
  const area = document.getElementById('dictationArea');
  if(!area) return;
  let html = '';
  sentences.forEach((s,i)=>{
    html += `<div style="margin-bottom:10px;padding:10px;background:#faf8f9;border-radius:10px;">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">

function startDictation(){
  const today = getToday();
  const ed = (DB.get('english_data')||{})[today];
  if(!ed) return;
  const sentences = ed.article.sentences;
  // Clear all inputs
  sentences.forEach((s,i)=>{
    const inp = document.getElementById('dictInput_'+i);
    const res = document.getElementById('dictResult_'+i);
    const hint = document.getElementById('dictHint_'+i);
    if(inp){inp.value='';inp.style.background='#faf8f9';}
    if(res){res.style.display='none';}
    if(hint){hint.style.display='none';}
  });
  document.getElementById('dictProgress').textContent = `共 ${sentences.length} 句 · 请逐句听写`;
  // Auto-play first sentence
  speakSentence(0);
}

function checkDictation(idx){
  const today = getToday();
  const ed = (DB.get('english_data')||{})[today];
  if(!ed) return;
  const s = ed.article.sentences[idx];
  const inp = document.getElementById('dictInput_'+idx);
  const res = document.getElementById('dictResult_'+idx);
  const hint = document.getElementById('dictHint_'+idx);
  if(!inp||!res) return;
  const userText = inp.value.trim();
  if(userText.length < 5) {res.style.display='none';if(hint)hint.style.display='none';return;}

  // Simple comparison: word-level match
  const userWords = userText.toLowerCase().replace(/[^a-z\s]/g,'').split(/\s+/).filter(w=>w);
  const correctWords = s.en.toLowerCase().replace(/[^a-z\s]/g,'').split(/\s+/).filter(w=>w);
  let matched = 0;
  const displayWords = correctWords.map(cw=>{
    const found = userWords.includes(cw);
    if(found) matched++;
    return found ? `<span style="color:#66bb6a;">${cw}</span>` : `<span style="color:#e57373;text-decoration:underline;">${cw}</span>`;
  }).join(' ');

  const pct = Math.round(matched/correctWords.length*100);
  const emoji = pct>=90?'🎉':pct>=60?'👍':'💪';
  res.style.display='block';
  res.innerHTML = `${emoji} 匹配度 ${pct}%<br>${displayWords}`;
  if(hint) hint.style.display = pct<90?'inline':'none';
  inp.style.background = pct>=90?'#e8f5e9':pct>=60?'#fff8e1':'#fce4ec';
}

function showDictHint(idx){
  const today = getToday();
  const ed = (DB.get('english_data')||{})[today];
  if(!ed) return;
  const s = ed.article.sentences[idx];
  const inp = document.getElementById('dictInput_'+idx);
  if(inp){inp.value = s.en; inp.style.background='#e8f5e9';}
  checkDictation(idx);
}

function revealAllDictation(){
  const today = getToday();
  const ed = (DB.get('english_data')||{})[today];
  if(!ed) return;
  ed.article.sentences.forEach((s,i)=>{
    const inp = document.getElementById('dictInput_'+i);
    if(inp){inp.value = s.en; inp.style.background='#e3f2fd';}
    checkDictation(i);
  });
}

// Word training from article
function extractVocab(sentences){
  const fullText = sentences.map(s=>s.en).join(' ');
  const words = fullText.toLowerCase().replace(/[^a-z\s]/g,'').split(/\s+/).filter(w=>w.length>4);
  const unique = [...new Set(words)];
  const shuffled = unique.sort(()=>Math.random()-0.5).slice(0,10);
  return shuffled.map(w=>({
    word:w,
    cn:getWordCN(w),
    revealed:false
  }));
}

function getWordCN(w){
  const dict = {
    advancement:'进步,发展',artificial:'人工的',intelligence:'智力,智能',fundamentally:'根本上',automated:'自动化的',analysis:'分析',machines:'机器',required:'需要,要求',experts:'专家',argues:'认为,争论',create:'创造',eliminates:'消除',particularly:'尤其,特别',creativity:'创造力',emotional:'情感的',
    climate:'气候',planning:'规划',unprecedented:'前所未有的',challenges:'挑战',extreme:'极端的',weather:'天气',forcing:'迫使',planners:'规划者',rethink:'重新思考',designed:'设计',buildings:'建筑',improved:'改善的',transportation:'交通',forests:'森林',becoming:'成为',essential:'必要的',components:'组成部分',modern:'现代的',
    lifelong:'终身的',learning:'学习',concept:'概念',important:'重要的',professionals:'专业人士',increasingly:'越来越',turning:'转向',courses:'课程',credentials:'证书',degrees:'学位',competitive:'有竞争力的',traditional:'传统的',replaced:'被取���',continuous:'持续的',development:'发展',skills:'技能',
    rapidly:'快速地',changing:'变化的',market:'市场',model:'模式',forever:'永远',
  };
  return dict[w]||'（雅思高频词）';
}

function renderVocab(ed){
  const area = document.getElementById('vocabArea');
  if(!area) return;
  const today = getToday();
  const vocabData = DB.get('vocab_data')||{};
  if(!vocabData[today]){
    vocabData[today] = extractVocab(ed.article.sentences);
    DB.set('vocab_data',vocabData);
  }
  const words = vocabData[today];
  let html = '<div style="display:flex;flex-wrap:wrap;gap:6px;">';
  words.forEach((w,i)=>{
    html += `<div onclick="revealWord(${i})" id="vw_${i}" style="cursor:pointer;padding:8px 12px;background:#f5f0f8;border-radius:10px;font-size:13px;font-weight:600;min-width:60px;text-align:center;transition:all .2s;">
      ${w.word}
    </div>`;
  });
  html += '</div><div style="margin-top:8px;font-size:11px;color:var(--text-light);">👆 点击单词查看释义</div>';
  area.innerHTML = html;
}

function revealWord(i){
  const today = getToday();
  const vocabData = DB.get('vocab_data')||{};
  const words = vocabData[today];
  if(!words||!words[i]) return;
  words[i].revealed = !words[i].revealed;
  DB.set('vocab_data',vocabData);
  const el = document.getElementById('vw_'+i);
  if(!el) return;
  if(words[i].revealed){
    el.style.background='linear-gradient(135deg,var(--pink-50),var(--blue-50))';
    el.innerHTML = `<div>${words[i].word}</div><div style="font-size:10px;font-weight:400;color:var(--pink-300);">${words[i].cn}</div>`;
  }else{
    el.style.background='#f5f0f8';
    el.innerHTML = words[i].word;
  }
}

function addExpense(){
  const item = document.getElementById('expItem').value.trim();
  const amount = parseFloat(document.getElementById('expAmount').value);
  const category = document.getElementById('expCategory').value;

  if(!expenses[today]) expenses[today]=[];
  expenses[today].push({item,amount,category,time:getNow()});
  DB.set('expenses',expenses);
  document.getElementById('expItem').value='';
  document.getElementById('expAmount').value='';
  renderExpense();

function deleteExpense(date,idx){
  const expenses = DB.get('expenses')||{};
  if(expenses[date]){expenses[date].splice(idx,1);}
  DB.set('expenses',expenses);
  renderExpense();
}

function saveWorklog(date){
  const completed = document.getElementById('wlCompleted').value.trim();
  const harvest = document.getElementById('wlHarvest').value.trim();
  const plan = document.getElementById('wlPlan').value.trim();
  const worklogs = DB.get('worklogs')||[];
  const idx = worklogs.findIndex(w=>w.date===date);
  if(idx>=0){worklogs[idx]={date,completed,harvest,plan};}
  else{worklogs.push({date,completed,harvest,plan});}
  DB.set('worklogs',worklogs);
  renderWorklog(date);
  showToast('已保存 ✅');
}

function optimizeWorklog(date){
  const worklogs = DB.get('worklogs')||[];
  const log = worklogs.find(w=>w.date===date);
  if(!log) return;

  const optimize = (text)=>{
    if(!text.trim()) return text;
    // Simple optimization: structure, add action verbs, quantify
    let opt = text
      .replace(/做了/g,'完成了').replace(/看了/g,'研读了')
      .replace(/写了/g,'撰写了').replace(/学了/g,'系统学习了');
    if(!opt.includes('。')) opt += '。';
    return '【优化版】'+opt;
  };

  const newCompleted = optimize(log.completed);
  const newHarvest = optimize(log.harvest);
  const newPlan = optimize(log.plan);

  document.getElementById('wlCompleted').value = newCompleted;
  document.getElementById('wlHarvest').value = newHarvest;
  document.getElementById('wlPlan').value = newPlan;
  showToast('已优化表述 ✨');
}

function getChangeHtml(history,key,currentVal){
  if(history.length<2 || !currentVal) return '<td></td>';
  const prev = history[history.length-1][key];
  if(!prev) return '<td></td>';
  const diff = currentVal - prev;
  if(diff===0) return '<td class="change-same">→0</td>';
  const cls = diff>0?'change-up':'change-down';
  const arrow = diff>0?'↑':'↓';
  return `<td class="${cls}">${arrow}${Math.abs(diff).toFixed(1)}</td>`;
}

function escHtml(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

// Smart XHS deep link: try to open app, fallback to web
function openXHS(e, schemeUrl, webUrl){
  e.preventDefault();
  const now = Date.now();
  // Try xhsdiscover:// scheme first (iOS/Android小红书App)
  if(schemeUrl && schemeUrl.startsWith('xhsdiscover://')){
    window.location.href = schemeUrl;
    // If app not installed, fallback to web after timeout
    setTimeout(function(){
      if(Date.now() - now < 2500) return; // App opened successfully
      if(webUrl){
        window.open(webUrl, '_blank');
      }else{
        window.open('https://www.xiaohongshu.com/explore', '_blank');
      }
    }, 2000);
  }else if(webUrl){
    window.open(webUrl, '_blank');
  }else{
    window.open('https://www.xiaohongshu.com/explore', '_blank');
  }
}

function showToast(msg){
  let toast = document.getElementById('toast');
  if(!toast){
    toast = document.createElement('div');
    toast.id='toast';
    toast.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.75);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;z-index:999;transition:opacity .3s;pointer-events:none;';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity='1';
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{toast.style.opacity='0';},2000);
}

    case 'worklog': renderWorklog(); break;
    case 'body': renderBody(); break;
  }
}

// ==================== INIT ====================
function init(){
  initDB();
  buildNav();
  updateDate();
  switchModule('daily');
  document.querySelector('.nav-item[data-mod="daily"]').classList.add('active');
}

// Service Worker for PWA
if('serviceWorker' in navigator){
  // Minimal offline cache
}

document.addEventListener('DOMContentLoaded',init);

// Handle mobile back button to close nav
window.addEventListener('popstate',()=>{
  if(document.getElementById('nav').classList.contains('open')) toggleNav(false);
});

// Prevent zoom on double tap
document.addEventListener('dblclick',function(e){
  if(e.target.tagName==='BUTTON'||e.target.tagName==='INPUT') e.preventDefault();
},{passive:false});
</script>
